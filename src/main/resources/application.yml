# 应用服务 WEB 访问端口
server:
  port: 8080
  servlet:
    context-path: /api
  # Tomcat 线程池配置（针对2核2G优化）
  tomcat:
    threads:
      max: 50
      min-spare: 10
    max-connections: 500
    accept-count: 100
    connection-timeout: 20000
# 数据源配置
spring:
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    # 基本数据源配置
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/friendxxx?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    # 使用Druid连接池（针对2核2G优化）
    druid:
      # 连接池配置
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      # 关闭监控页面（生产环境）
      stat-view-servlet:
        enabled: false
      # 性能优化
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      validation-query: SELECT 1
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000

  redis:
    #单节点redis配置
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    database: ${REDIS_DATABASE:2}
    password: ${REDIS_PASSWORD:}
    # Lettuce 连接池配置（针对2核2G优化）
    lettuce:
      pool:
        max-active: 8
        max-idle: 4
        min-idle: 2
        max-wait: 3000
    timeout: 3000
#    redis分片集群配置
#    cluster:
#      nodes: ${your.redis.cluster.nodes}
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:friendxxx}
    password: ${RABBITMQ_PASSWORD:123456}
    #虚拟host 可以不设置,使用server默认host
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:FZZ}
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.xzh.friendxxx.model.entity
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    # 开启驼峰命名
    map-underscore-to-camel-case: true

knife4j:
  # 生产环境关闭 Knife4j（节省内存）
  enable: false
  production: true
  setting:
    language: zh_cn
  basic:
    enable: ${knife4j.basic.enable:false}
    username: ${knife4j.basic.username:admin}
    password: ${KNIFE4J_BASIC_PASSWORD:}
your:
  alioss:
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    bucket-name: ${ALIYUN_OSS_BUCKET_NAME:}
    endpoint: ${ALIYUN_OSS_ENDPOINT:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-at-least-32-bytes}
    ttl-seconds: ${JWT_TTL_SECONDS:2592000}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:5173,http://127.0.0.1:5173,capacitor://localhost,https://localhost}
  ai:
    deepseek:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      chat-model: ${DEEPSEEK_CHAT_MODEL:deepseek-v4-flash}
      utility-model: ${DEEPSEEK_UTILITY_MODEL:deepseek-v4-flash}
      connect-timeout: 5s
      first-token-timeout: 30s
      response-timeout: 120s
  rate-limit:
    # 生产默认开启；开发环境可设置 APP_RATE_LIMIT_ENABLED=false
    enabled: ${APP_RATE_LIMIT_ENABLED:true}




